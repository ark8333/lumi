<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf5f3">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Lumi</title>
<style>
:root{--bg:#fbf5f3;--card:#fff;--ink:#3b1e34;--mute:#937a8c;--rose:#c4577e;--rose-d:#a23f66;--rose-l:#f7e1e8;--lila:#8b6bbf;--lila-l:#ece4f6;--line:#f0e2e7;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:15px/1.45 var(--sans)}
body{min-height:100vh;background:radial-gradient(1100px 480px at 110% -10%,#f6dbe5 0,transparent 60%),radial-gradient(900px 400px at -25% 0,#ece2f6 0,transparent 55%),var(--bg);background-attachment:fixed}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(100px + env(safe-area-inset-bottom))}
.hd{margin:6px 2px 18px}.hd .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hd h1{font:500 32px/1.1 var(--serif);margin:4px 0 0;letter-spacing:-.01em}
.hd .back{border:0;background:none;color:var(--rose-d);font:600 14px var(--sans);padding:0;margin-bottom:8px;cursor:pointer}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(80,30,60,.04),0 10px 26px -14px rgba(120,40,80,.2)}
.card h2{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:600 15px var(--sans);background:var(--rose);color:#fff;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--rose-l);color:var(--rose-d)}.btn.soft{background:#f3ecef;color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}.btn.block{width:100%;display:block}.btn.danger{background:#fbe4e4;color:#b23b3b}
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;border-radius:16px;margin-bottom:8px;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .15s}
.chk:last-child{margin-bottom:0}
.chk .ic{font-size:19px;width:36px;height:36px;flex:none;display:grid;place-items:center;background:var(--rose-l);border-radius:12px}
.chk .tx{flex:1}.chk small{display:block;color:var(--mute);font-size:12px}
.chk .tick{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid #e6d3db;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.chk.sel{border-color:var(--rose);background:var(--rose-l);box-shadow:0 0 0 2px var(--rose-l)}
.bar{height:8px;border-radius:99px;background:#f3e3ea;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c4577e,#8b6bbf);border-radius:99px}
.chk.on{background:linear-gradient(90deg,#fdf0f4,#fff)}.chk.on .tick{background:var(--rose);border-color:var(--rose)}.chk.on .tx{color:var(--mute);text-decoration:line-through}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(255,250,251,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10}
.nav button{flex:1;border:0;background:none;font:600 11px var(--sans);color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;cursor:pointer}
.nav button span{font-size:21px;filter:grayscale(.7);opacity:.7}
.nav button.on{color:var(--rose-d)}.nav button.on span{filter:none;opacity:1}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 13px var(--sans);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mute{color:var(--mute)}.small{font-size:13px}
.empty{color:var(--mute);text-align:center;padding:16px 8px;font-size:14px}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(40,15,35,.4)}
.sheet-card{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-card h3{font:500 25px var(--serif);margin:0 0 12px}
label.f{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.08em;margin:12px 0 5px;text-transform:uppercase}
input,textarea,select{width:100%;font:16px var(--sans);padding:12px 14px;border:1px solid #ead8df;border-radius:14px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-l)}
input[type=file]{padding:10px;font-size:14px}
textarea{min-height:110px;resize:vertical;font-family:var(--sans)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}
.entry{padding:14px 0;border-bottom:1px solid var(--line)}.entry:first-of-type{padding-top:0}.entry:last-child{border:0;padding-bottom:0}
.entry .txt{white-space:pre-wrap;margin-top:6px}
.photo{width:100%;border-radius:16px;margin-top:10px;display:block;max-height:420px;object-fit:cover;background:var(--rose-l)}
.ward{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.witem{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.witem .ph{aspect-ratio:1;background:linear-gradient(135deg,var(--rose-l),var(--lila-l));display:grid;place-items:center;font-size:40px;overflow:hidden}
.witem .ph img{width:100%;height:100%;object-fit:cover}
.witem .in{padding:10px 12px}.witem b{display:block;font-size:14px;line-height:1.25}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--rose-l);color:var(--rose-d);margin-top:4px}
.tag.l{background:var(--lila-l);color:#6a4c9c}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0;padding-bottom:0}.li:first-child{padding-top:0}
.li .grow{flex:1;min-width:0}
.x{border:0;background:none;color:var(--mute);font-size:17px;padding:4px 8px;cursor:pointer;flex:none}
.big{font:500 56px/1 var(--serif)}
.meter{position:relative;height:14px;border-radius:99px;display:flex;margin:16px 0 6px}
.meter i{display:block;height:100%}.meter i:first-child{border-radius:99px 0 0 99px}.meter i:last-of-type{border-radius:0 99px 99px 0}
.marker{position:absolute;top:-5px;width:5px;height:24px;background:var(--ink);border-radius:3px;transition:left .12s;left:0;display:none}
.reto{background:linear-gradient(135deg,#c4577e,#8b6bbf);color:#fff;border:0}
.reto h2{color:rgba(255,255,255,.78)}.reto p{font:500 21px/1.3 var(--serif);margin:0 0 16px}
.reto .btn{background:rgba(255,255,255,.2);color:#fff}.reto .btn.w{background:#fff;color:var(--rose-d)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;text-align:left;cursor:pointer;font:inherit;color:inherit;box-shadow:0 10px 26px -16px rgba(120,40,80,.25)}
.tile .e{font-size:30px}.tile b{display:block;font:500 20px var(--serif);margin-top:8px}.tile span{font-size:12px;color:var(--mute)}
.stat{display:flex;gap:10px}.stat div{flex:1;background:#fdf8f9;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font:500 24px var(--serif)}.stat span{font-size:11px;color:var(--mute)}
.lock{position:fixed;inset:0;z-index:50;background:radial-gradient(800px 500px at 50% 0,#f6dbe5,transparent),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.lock.hidden{display:none}
.dots{display:flex;gap:16px;margin:22px 0 34px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rose)}.dots i.on{background:var(--rose)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:16px}
.pad button{height:74px;border-radius:50%;border:0;background:#fff;font:500 28px var(--serif);color:var(--ink);box-shadow:0 6px 18px -10px rgba(120,40,80,.35);cursor:pointer}
.pad button.n{background:none;box-shadow:none;font-size:22px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.week div{font-size:11px;color:var(--mute);text-transform:capitalize}
.week i{display:block;margin:6px auto 0;width:32px;height:32px;border-radius:11px;background:#f3e6eb}
.moods{display:flex;gap:6px;flex-wrap:wrap}.moods button{font-size:25px;border:2px solid transparent;background:#fff;border-radius:14px;padding:5px 8px;cursor:pointer}.moods button.on{border-color:var(--rose);background:var(--rose-l)}
.warn{background:#fff4e5;border:1px solid #f4d9b0;color:#8a5a14;border-radius:16px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.drawn{background:linear-gradient(135deg,#3b1e34,#6a3a5f);color:#fff;border-radius:18px;padding:20px;margin:12px 0;font:500 20px/1.35 var(--serif);text-align:center}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e23b5a;margin-right:8px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
audio{width:100%;height:38px;margin-top:6px}
/* ===== Modo oscuro ===== */
html.dark{--bg:#17101a;--card:#221823;--card2:#2c1f2c;--ink:#f3e6ee;--mute:#a893a3;--rose:#d8698f;--rose-d:#f39abb;--rose-l:#3d2433;--lila:#a487d4;--lila-l:#2e2540;--line:#382835;color-scheme:dark}
html.dark body{background:radial-gradient(1100px 480px at 110% -10%,#3a1a2c 0,transparent 60%),radial-gradient(900px 400px at -25% 0,#261d3d 0,transparent 55%),var(--bg)}
html.dark .card{box-shadow:none}
html.dark .chk,html.dark input,html.dark textarea,html.dark select,html.dark .chip,html.dark .witem,html.dark .tile,html.dark .moods button,html.dark .pad button:not(.n),html.dark .msg.a,html.dark .stat div{background:var(--card2);color:var(--ink);border-color:var(--line)}
html.dark .tile,html.dark .pad button{box-shadow:none}
html.dark .chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
html.dark .chk.on{background:linear-gradient(90deg,#3d2232,var(--card2))}
html.dark .chk.sel{background:var(--rose-l);border-color:var(--rose)}
html.dark .chk .tick{border-color:#5a4352}
html.dark .nav{background:rgba(23,16,26,.92)}
html.dark .btn.soft{background:#3a2b37;color:var(--ink)}
html.dark .btn.danger{background:#4a2228;color:#ff9fa8}
html.dark .warn{background:#33281a!important;border-color:#5a4420!important;color:#f1d29c!important}
html.dark .sw{background:#4a3846}
html.dark .sw.on{background:var(--rose)}
html.dark .week i,html.dark .bar{background:#382835}
html.dark .lock{background:radial-gradient(800px 500px at 50% 0,#3a1a2c,transparent),var(--bg)}
html.dark .sheet-bg{background:rgba(0,0,0,.6)}
html.dark svg circle[stroke="#f3e3ea"]{stroke:#382835}
html.dark svg circle[fill="#fff"]{fill:var(--card)}
html.dark svg text{fill:var(--mute)}
html.dark svg text[font-size="19"]{fill:var(--ink)}
html.dark #toast{background:#f3e6ee;color:#17101a}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;line-height:1.45}
.msg.u{margin-left:auto;background:var(--rose);color:#fff;border-bottom-right-radius:6px}
.msg.a{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.t{color:var(--mute);font-style:italic}
.sw{position:relative;width:48px;height:28px;flex:none;border-radius:99px;background:#e9dbe1;border:0;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--rose)}.sw.on::after{left:23px}
</style>
</head>
<body>
<main id="main"></main>

<nav class="nav">
  <button data-act="go" data-v="hoy"><span>🌸</span>Hoy</button>
  <button data-act="go" data-v="diario"><span>📔</span>Diario</button>
  <button data-act="go" data-v="rutinas"><span>✨</span>Rutinas</button>
  <button data-act="go" data-v="voz"><span>🎤</span>Voz</button>
  <button data-act="go" data-v="mas"><span>💗</span>Más</button>
</nav>

<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-act="close"></div><div class="sheet-card" id="sheetCard"></div></div>

<div id="lock" class="lock hidden">
  <div style="font-size:40px">🌸</div>
  <div class="mute" id="lockMsg" style="margin-top:8px">Introduce tu PIN</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad">
    <button data-act="key" data-k="1">1</button><button data-act="key" data-k="2">2</button><button data-act="key" data-k="3">3</button>
    <button data-act="key" data-k="4">4</button><button data-act="key" data-k="5">5</button><button data-act="key" data-k="6">6</button>

  </div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<a id="fab" target="_blank" rel="noopener noreferrer" style="position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#c4577e,#8b6bbf);color:#fff;display:none;place-items:center;font-size:26px;text-decoration:none;box-shadow:0 10px 24px -8px rgba(120,40,80,.55);z-index:9" aria-label="Abrir chatbot">💬</a>

<script>

const APP_V='1.11';

const SECS=[['diario','📔','Diario y medidas'],['voz','🎤','Voz'],['entreno','🏋️','Entreno'],['armario','👗','Armario'],['salud','💊','Salud'],['intimo','🔒','Íntimo']];

let _db;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('lumi_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(mode,fn){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('m',mode);const q=fn(t.objectStore('m'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
async function putMedia(blob,id){id=id||uid();await tx('readwrite',s=>s.put(blob,id));return id}
const getMedia=id=>tx('readonly',s=>s.get(id));
const delMedia=id=>id&&tx('readwrite',s=>s.delete(id)).catch(()=>{});
const urlCache={};
async function mediaURL(id){if(!id)return'';if(urlCache[id])return urlCache[id];try{const b=await getMedia(id);if(!b)return'';return urlCache[id]=URL.createObjectURL(b)}catch(e){return''}}
function hydrate(){document.querySelectorAll('[data-media]').forEach(async el=>{const u=await mediaURL(el.dataset.media);if(u)el.src=u})}
function resizeImg(file,max=1200){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),'image/jpeg',.85)};img.onerror=()=>res(file);img.src=u})}
async function photoFrom(inputId){const f=document.getElementById(inputId);if(!f||!f.files||!f.files[0])return null;return putMedia(await resizeImg(f.files[0]))}

async function ai(messages,max=500,temp=.9,retry=1){
  max=Math.max(max,1500);
  const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',
    headers:{'Authorization':'Bearer '+S.settings.aiKey,'Content-Type':'application/json','X-Title':'Lumi'},
    body:JSON.stringify({model:S.settings.aiModel||'openrouter/free',messages,max_tokens:max,temperature:temp})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status===401?'La clave no es válida':r.status===429?'Límite de uso alcanzado, prueba más tarde':((j.error&&j.error.message)||'Error '+r.status));
  const t=((((j.choices||[])[0]||{}).message||{}).content||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
  if(!t&&retry>0)return ai(messages,max,temp,retry-1);
  return t;
}
function aiErr(st,j){return st===401?'La clave no es válida':st===429?'Límite de uso alcanzado, prueba más tarde':((j&&j.error&&j.error.message)||'Error '+st)}
async function aiStream(messages,onDelta,max=1500,temp=.7){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),90000);
  try{
    const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal:ctl.signal,
      headers:{'Authorization':'Bearer '+S.settings.aiKey,'Content-Type':'application/json','X-Title':'Lumi'},
      body:JSON.stringify({model:S.settings.aiModel||'openrouter/free',messages,max_tokens:Math.max(max,1500),temperature:temp,stream:true})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(aiErr(r.status,j))}
    if(!r.body||!r.body.getReader){const j=await r.json().catch(()=>({}));const t=((((j.choices||[])[0]||{}).message||{}).content||'');onDelta&&onDelta(t);return t.replace(/<think>[\s\S]*?<\/think>/g,'').trim()}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(!d||d==='[DONE]')continue;
        let j;try{j=JSON.parse(d)}catch(e){continue}
        if(j.error)throw new Error(j.error.message||'Error de la IA');
        const c=(((j.choices||[])[0]||{}).delta||{}).content;if(c){full+=c;onDelta&&onDelta(full)}}}
    return full.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
  }catch(e){if(e.name==='AbortError')throw new Error('La IA está tardando demasiado, prueba otra vez');throw e}
  finally{clearTimeout(to)}}

function parseGuide(t){const m=(t||'').match(/\{[\s\S]*\}/);if(!m)return null;let j;try{j=JSON.parse(m[0])}catch(e){return null}
  const pasos=(Array.isArray(j.pasos)?j.pasos:[]).slice(0,12).map(p=>({t:String(p.t||p.titulo||''),d:String(p.d||p.texto||''),seg:Math.max(0,Math.min(3600,parseInt(p.seg)||0))})).filter(p=>p.t||p.d);
  if(!pasos.length)return null;
  return {titulo:String(j.titulo||''),intro:String(j.intro||''),pasos,errores:(Array.isArray(j.errores)?j.errores:[]).slice(0,5).map(String),consejo:String(j.consejo||'')}}
function parseGuideText(t){t=(t||'').replace(/<think>[\s\S]*?(<\/think>|$)/g,'');const g={titulo:'',intro:'',pasos:[],errores:[],consejo:''};
  for(let l of t.split('\n')){l=l.trim();if(!l)continue;let m;
    if(m=l.match(/^#+\s*(.+)/))g.titulo=m[1].replace(/\*/g,'');
    else if(m=l.match(/^>\s*(.+)/))g.intro=m[1].replace(/\*/g,'');
    else if(m=l.match(/^\**(\d+)[.)]\**\s*(.+)/)){const p=m[2].split('|').map(x=>x.trim().replace(/\*\*/g,''));g.pasos.push({t:p[0]||'',d:p[1]||'',seg:Math.max(0,Math.min(3600,parseInt(p[2])||0))})}
    else if(m=l.match(/^(!|⚠️)\s*(.+)/))g.errores.push(m[2]);
    else if(m=l.match(/^(💡|\*)\s*(.+)/))g.consejo=m[2].replace(/\*/g,'')}
  return g}

function parsePlan(txt){
  const m=txt.match(/\{[\s\S]*\}/);if(!m)return null;let j;try{j=JSON.parse(m[0])}catch(e){return null}
  if(!j||!Array.isArray(j.days)||!j.days.length)return null;
  const days=j.days.slice(0,6).map(d=>({name:String(d.name||'Día'),ex:(Array.isArray(d.ex)?d.ex:[]).slice(0,8).map(e=>({n:String(e.n||e.name||''),s:String(e.s||e.series||3),r:String(e.r||e.reps||''),t:String(e.t||e.tip||'')})).filter(e=>e.n)})).filter(d=>d.ex.length);
  return days.length?{title:String(j.title||'Mi plan'),note:String(j.note||''),days,ai:true}:null;
}

function chart(key){

  const d=ys.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area=d+`L${x(ys.length-1).toFixed(1)},${H-p}L${x(0).toFixed(1)},${H-p}Z`;
  const diff=+(ys[ys.length-1]-ys[0]).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4577e" stop-opacity=".28"/><stop offset="1" stop-color="#c4577e" stop-opacity="0"/></linearGradient></defs>

let mic=null,rec=null,timer=null,exT0=0;
function pitch(buf,sr){
  let n=buf.length,rms=0;for(let i=0;i<n;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/n);if(rms<0.012)return -1;
  let r1=0,r2=n-1;const th=0.2;
  for(let i=0;i<n/2;i++)if(Math.abs(buf[i])<th){r1=i;break}
  for(let i=1;i<n/2;i++)if(Math.abs(buf[n-i])<th){r2=n-i;break}
  const b=buf.slice(r1,r2);n=b.length;const maxLag=Math.min(n-1,Math.floor(sr/60));const c=new Float32Array(maxLag+1);
  for(let i=0;i<=maxLag;i++){let s=0;for(let j=0;j<n-i;j++)s+=b[j]*b[j+i];c[i]=s}
  let d=0;while(d<maxLag&&c[d]>c[d+1])d++;
  let mx=-1,mp=-1;for(let i=d;i<=maxLag;i++)if(c[i]>mx){mx=c[i];mp=i}
  let T0=mp;if(T0<=0||T0>=maxLag)return -1;
  const x1=c[T0-1],x2=c[T0],x3=c[T0+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;if(a)T0=T0-bb/(2*a);
  return sr/T0;
}

    const ac=new (window.AudioContext||window.webkitAudioContext)();const an=ac.createAnalyser();an.fftSize=2048;ac.createMediaStreamSource(st).connect(an);
    const buf=new Float32Array(an.fftSize);let sm=0;mic={st,ac,samples:[],iv:0};
    mic.iv=setInterval(()=>{
      an.getFloatTimeDomainData(buf);const f=pitch(buf,ac.sampleRate);const el=$('#hz'),lb=$('#hzl'),mk=$('#hzm');if(!el)return;
      if(f>70&&f<450){sm=sm?sm*.7+f*.3:f;mic.samples.push(sm);el.textContent=Math.round(sm);
        const p=Math.max(0,Math.min(1,(sm-80)/220));mk.style.display='block';mk.style.left=`calc(${(p*100).toFixed(1)}% - 2px)`;
        lb.textContent=sm<145?'Grave':sm<165?'Andrógina':sm<=255?'Femenina ✨':'Aguda';}
      else{sm=0;lb.textContent='Habla…'}
    },70);
    render();
  }catch(e){toast('No hay acceso al micrófono')}
}
function stopMic(){
  if(!mic)return;clearInterval(mic.iv);mic.st.getTracks().forEach(t=>t.stop());try{mic.ac.close()}catch(e){}
  const s=mic.samples;mic=null;
  if(s.length>20){const avg=Math.round(s.reduce((a,b)=>a+b,0)/s.length);toast(`Tono medio: ${avg} Hz`)}
  if(view==='voz')render();
}
async function toggleRec(){
  if(rec){rec.mr.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const ch=[];
    mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const dur=Math.round((Date.now()-rec.t0)/1000);rec=null;
      if(ch.length){const blob=new Blob(ch,{type:mr.mimeType||'audio/webm'});const id=await putMedia(blob);const n=new Date();S.recs.unshift({id:uid(),date:ymd(),time:pad2(n.getHours())+':'+pad2(n.getMinutes()),media:id,dur});save();toast('Grabación guardada')}
      render()};
    mr.start();rec={mr,t0:Date.now()};render();
  }catch(e){toast('No se puede grabar en este navegador')}
}

function hashPin(p){let h=5381;for(const ch of 'lumi:'+p)h=(((h<<5)+h)+ch.charCodeAt(0))>>>0;let h2=52711;for(const ch of p+':imul')h2=(Math.imul(h2^ch.charCodeAt(0),2654435761))>>>0;return h.toString(36)+h2.toString(36)}

function drawDots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length))}

  editWard:el=>{const w=S.wardrobe.find(x=>x.id===el.dataset.id)||{type:'Vestido',status:'tengo'};
    sheet(`<h3>${w.id?'Editar':'Añadir al armario'}</h3>${w.photo?`<img class="photo" data-media="${w.photo}" style="max-height:220px;margin:0 0 6px">`:''}
    <label class="f">Nombre</label><input id="wName" value="${esc(w.name||'')}" placeholder="Ej: Vestido negro de punto">
    <div class="grid2"><div><label class="f">Tipo</label><select id="wType">${WTYPES.map(t=>`<option ${w.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label class="f">Estado</label><select id="wStatus"><option value="tengo" ${w.status!=='quiero'?'selected':''}>Lo tengo</option><option value="quiero" ${w.status==='quiero'?'selected':''}>Lo quiero</option></select></div>
    <div><label class="f">Talla</label><input id="wSize" value="${esc(w.size||'')}"></div><div><label class="f">Precio (€)</label><input id="wPrice" inputmode="decimal" value="${esc(w.price||'')}"></div></div>
    <label class="f">Color / notas</label><input id="wNote" value="${esc(w.note||'')}" placeholder="Color, tienda, enlace…">
    <label class="f">Foto</label><input type="file" id="wPhoto" accept="image/*">
    <div class="actions">${w.id?`<button class="btn danger" data-act="delWard" data-id="${w.id}">Borrar</button>`:'<button class="btn soft" data-act="close">Cancelar</button>'}<button class="btn" data-act="saveWard" data-id="${w.id||''}">Guardar</button></div>`);hydrate()},
  saveWard:async el=>{const name=fv('wName');if(!name)return toast('Ponle un nombre');const old=S.wardrobe.find(x=>x.id===el.dataset.id);const ph=await photoFrom('wPhoto');
    if(ph&&old&&old.photo)delMedia(old.photo);
    const d={name,type:fv('wType'),status:fv('wStatus'),size:fv('wSize'),price:fv('wPrice'),note:fv('wNote'),photo:ph||(old&&old.photo)||''};
    if(old)Object.assign(old,d);else S.wardrobe.unshift({id:uid(),...d});save();closeSheet();render()},
  delWard:el=>{if(!confirm('¿Borrar del armario?'))return;const w=S.wardrobe.find(x=>x.id===el.dataset.id);delMedia(w.photo);S.wardrobe=S.wardrobe.filter(x=>x!==w);save();closeSheet();render()},
  /* Salud */
  editMed:el=>{const m=S.meds.find(x=>x.id===el.dataset.id)||{};
    sheet(`<h3>${m.id?'Editar':'Añadir'} medicación</h3><label class="f">Nombre</label><input id="dName" value="${esc(m.name||'')}"><label class="f">Dosis (tal como te la han pautado)</label><input id="dDose" value="${esc(m.dose||'')}" placeholder="Ej: 1 comprimido, 2 pulsaciones…">
    <div class="grid2"><div><label class="f">Hora</label><input type="time" id="dTime" value="${esc(m.time||'')}"></div><div><label class="f">Desde</label><input type="date" id="dSince" value="${esc(m.since||'')}"></div></div>
    <div class="actions"><button class="btn soft" data-act="close">Cancelar</button><button class="btn" data-act="saveMed" data-id="${m.id||''}">Guardar</button></div>`)},
  saveMed:el=>{const name=fv('dName');if(!name)return toast('Ponle un nombre');const d={name,dose:fv('dDose'),time:fv('dTime'),since:fv('dSince')};const m=S.meds.find(x=>x.id===el.dataset.id);
    if(m)Object.assign(m,d);else S.meds.push({id:uid(),...d});save();closeSheet();render()},
  delMed:el=>{if(!confirm('¿Quitar esta medicación de la lista?'))return;S.meds=S.meds.filter(x=>x.id!==el.dataset.id);save();render()},
  editAppt:()=>{sheet(`<h3>Nueva cita</h3><label class="f">Fecha</label><input type="date" id="aDate" value="${ymd()}"><label class="f">Qué es</label><input id="aText" placeholder="Ej: Endocrino, analítica, depilación láser…">
    <div class="actions"><button class="btn soft" data-act="close">Cancelar</button><button class="btn" data-act="saveAppt">Guardar</button></div>`)},
  saveAppt:()=>{const text=fv('aText');if(!text)return toast('Escribe qué cita es');S.appts.push({id:uid(),date:fv('aDate')||ymd(),text});save();closeSheet();render()},
  delAppt:el=>{S.appts=S.appts.filter(x=>x.id!==el.dataset.id);save();render()},
  editLab:()=>{const names=[...new Set(S.labs.map(l=>l.name))];
    sheet(`<h3>Valor de analítica</h3><label class="f">Fecha</label><input type="date" id="lDate" value="${ymd()}"><label class="f">Parámetro</label><input id="lName" list="lNames" placeholder="Ej: Estradiol, Testosterona…"><datalist id="lNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <div class="grid2"><div><label class="f">Valor</label><input id="lVal" inputmode="decimal"></div><div><label class="f">Unidad</label><input id="lUnit" placeholder="pg/ml, ng/dl…"></div></div><label class="f">Nota</label><input id="lNote">
    <div class="actions"><button class="btn soft" data-act="close">Cancelar</button><button class="btn" data-act="saveLab">Guardar</button></div>`)},
  saveLab:()=>{const name=fv('lName'),value=fv('lVal');if(!name||!value)return toast('Pon parámetro y valor');S.labs.push({id:uid(),date:fv('lDate')||ymd(),name,value,unit:fv('lUnit'),note:fv('lNote')});save();closeSheet();render()},
  delLab:el=>{S.labs=S.labs.filter(x=>x.id!==el.dataset.id);save();render()},
  /* Íntimo */
  ilvl:el=>{ilvl=+el.dataset.l;drawn=null;render()},
  drawInt:()=>{const pool=S.intimate.filter(i=>(!ilvl||i.lvl===ilvl)&&(!drawn||i.id!==drawn.id||S.intimate.length===1));if(!pool.length)return toast('No hay tareas en este nivel');drawn=pool[Math.floor(Math.random()*pool.length)];render()},
  intDone:()=>{if(!drawn)return;S.intimateLog.push({date:ymd(),text:drawn.text});drawn=null;save();toast('Hecha ✓');render()},
  editInt:el=>{const i=S.intimate.find(x=>x.id===el.dataset.id)||{lvl:1};
    sheet(`<h3>${i.id?'Editar tarea':'Nueva tarea'}</h3><label class="f">Tarea</label><textarea id="iText" placeholder="Escribe tu tarea…">${esc(i.text||'')}</textarea>
    <label class="f">Intensidad</label><select id="iLvl">${[1,2,3].map(l=>`<option value="${l}" ${i.lvl===l?'selected':''}>${FL[l]}</option>`).join('')}</select>
    <div class="actions"><button class="btn soft" data-act="close">Cancelar</button><button class="btn" data-act="saveInt" data-id="${i.id||''}">Guardar</button></div>`)},
  saveInt:el=>{const text=fv('iText');if(!text)return toast('Escribe la tarea');const d={text,lvl:+fv('iLvl')||1};const i=S.intimate.find(x=>x.id===el.dataset.id);
    if(i)Object.assign(i,d);else S.intimate.push({id:uid(),...d});save();closeSheet();render()},
  delInt:el=>{if(!confirm('¿Borrar esta tarea?'))return;S.intimate=S.intimate.filter(x=>x.id!==el.dataset.id);if(drawn&&drawn.id===el.dataset.id)drawn=null;save();render()},
  clearIntLog:()=>{if(!confirm('¿Borrar el historial?'))return;S.intimateLog=[];save();render()},
  /* Retos */
  editReto:el=>{const i=el.dataset.i!==undefined?+el.dataset.i:-1;
    sheet(`<h3>${i>=0?'Editar reto':'Nuevo reto'}</h3><textarea id="tText" style="min-height:80px">${i>=0?esc(S.retos[i]):''}</textarea><div class="actions"><button class="btn soft" data-act="close">Cancelar</button><button class="btn" data-act="saveReto" data-i="${i}">Guardar</button></div>`)},
  saveReto:el=>{const t=fv('tText');if(!t)return toast('Escribe el reto');const i=+el.dataset.i;if(i>=0)S.retos[i]=t;else S.retos.push(t);save();closeSheet();render()},
  delReto:el=>{const i=+el.dataset.i;if(S.retoPick&&S.retoPick.text===S.retos[i])S.retoPick=null;S.retos.splice(i,1);save();render()},
  /* Ajustes */
  setPin:()=>{sheet(`<h3>${S.settings.pin?'Cambiar':'Poner'} PIN</h3><label class="f">PIN de 4 números</label><input type="password" id="p1" inputmode="numeric" maxlength="4" pattern="[0-9]*"><label class="f">Repite el PIN</label><input type="password" id="p2" inputmode="numeric" maxlength="4" pattern="[0-9]*">
    <p class="small mute">Si lo olvidas no hay forma de recuperarlo sin borrar los datos. Haz antes una copia.</p><div class="actions"><button class="btn soft" data-act="close">Cancelar</button><button class="btn" data-act="savePin">Guardar</button></div>`)},
  savePin:()=>{const a=fv('p1'),b=fv('p2');if(!/^\d{4}$/.test(a))return toast('Tienen que ser 4 números');if(a!==b)return toast('No coinciden');S.settings.pin=hashPin(a);save();closeSheet();render();toast('PIN activado 🔒')},
  delPin:()=>{if(!confirm('¿Quitar el PIN?'))return;S.settings.pin='';save();render()},
  discreet:()=>{S.settings.discreet=!S.settings.discreet;save();render()},
  key:el=>{const k=el.dataset.k;if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;drawDots();
    if(pinBuf.length===4){if(hashPin(pinBuf)===S.settings.pin){$('#lock').classList.add('hidden');pinBuf=''}else{const p=$('#dots');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');$('#lockMsg').textContent='PIN incorrecto';setTimeout(()=>{pinBuf='';drawDots()},350)}}},
  export:async()=>{toast('Preparando copia…');const ids=[...S.journal.map(e=>e.photo),...S.wardrobe.map(w=>w.photo),...S.recs.map(r=>r.media)].filter(Boolean);const media={};
    for(const id of ids){try{const b=await getMedia(id);if(b)media[id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}catch(e){}}
    const blob=new Blob([JSON.stringify({app:'lumi',v:1,state:{...S,settings:{...S.settings,aiKey:''}},media})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${S.settings.discreet?'notas':'lumi'}-copia-${ymd()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},
  import:()=>$('#importFile').click(),
  wipe:async()=>{if(!confirm('Se borrará TODO: diario, fotos, grabaciones, tareas… ¿Seguro?'))return;if(!confirm('Última confirmación. No se puede deshacer.'))return;
    try{localStorage.removeItem(KEY)}catch(e){}try{indexedDB.deleteDatabase('lumi_media')}catch(e){}location.reload()}
};
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=='lumi'||!d.state)throw 0;if(!confirm('Esto sustituirá los datos actuales por los de la copia. ¿Continuar?'))return;
    for(const [id,url] of Object.entries(d.media||{})){const b=await (await fetch(url)).blob();await putMedia(b,id)}
    const k=S.settings.aiKey;S=Object.assign(JSON.parse(JSON.stringify(DEF)),d.state);if(!S.settings.aiKey)S.settings.aiKey=k;save();render();toast('Copia restaurada ✓')}catch(err){toast('Ese archivo no es una copia válida')}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('keydown',e=>{if(e.target.id==='aiIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ACT.aiSend()}});
document.addEventListener('change',e=>{if(e.target.dataset.chg==='name'){S.settings.name=e.target.value.trim();save();toast('Guardado ✓')}});

function stageOpts(act){return STAGES.slice(1).map((s,i)=>`<button class="chk ${S.stage===i+1?'sel':''}" data-act="${act}" data-s="${i+1}"><span class="ic">${s.e}</span><span class="tx"><b>${s.n}</b><small>${s.d}</small></span></button>`).join('')}
function renderNav(){document.querySelectorAll('.nav button').forEach(b=>{const v=b.dataset.v;b.style.display=SECS.some(s=>s[0]===v)&&!secOn(v)?'none':''})}
function welcome(){sheet(`<h3>Bienvenida 🌸</h3><p class="mute" style="margin-top:-4px">Vamos a adaptar la app a ti. Todo se puede cambiar luego en Ajustes.</p>
  <label class="f">¿Cómo quieres que te llame? (opcional)</label><input id="obName" value="${esc(S.settings.name)}">${nameUI('obName')}
  <label class="f">¿En qué punto estás?</label>${stageOpts('obStage')}
  <label class="f">¿Qué quieres usar?</label>${SECS.map(s=>`<div class="li"><span style="font-size:20px">${s[1]}</span><div class="grow">${s[2]}</div><button class="sw ${secOn(s[0])?'on':''}" data-act="togSec" data-k="${s[0]}"></button></div>`).join('')}
  <button class="btn block" style="margin-top:16px" data-act="startApp">Empezar</button>`)}

/* ================= App instalable (PWA) ================= */
let installEv=null;
const isInstalled=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;if(view==='ajustes'||view==='hoy')render()});
window.addEventListener('appinstalled',()=>{installEv=null;toast('¡App instalada! 🎉');render()});

/* ================= Auto-actualización ================= */
let updChecking=false;
const appBusy=()=>!$('#sheet').classList.contains('hidden')||aiBusy||!!rec||!!mic||!!timer||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
async function checkUpdate(){
  if(!/^https?:/.test(location.protocol)||updChecking||document.hidden)return;updChecking=true;
  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const APP_V='([^']+)'/);
    if(m&&m[1]!==APP_V){
      let tries={};try{tries=JSON.parse(sessionStorage.getItem('lumi_upd')||'{}')}catch(e){}
      if((tries[m[1]]||0)>=2){updChecking=false;return}
      if(appBusy()){updChecking=false;setTimeout(checkUpdate,20000);return}
      tries[m[1]]=(tries[m[1]]||0)+1;try{sessionStorage.setItem('lumi_upd',JSON.stringify(tries))}catch(e){}
      toast('✨ Nueva versión, actualizando…');
      try{await fetch(location.href,{cache:'reload'})}catch(e){}
      setTimeout(()=>location.reload(),900);return}
  }catch(e){}
  updChecking=false}
setTimeout(checkUpdate,3000);
setInterval(checkUpdate,30*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(checkUpdate,1500)});

/* ================= Arranque ================= */
try{const pv=localStorage.getItem('lumi_ver');if(pv&&pv!==APP_V)setTimeout(()=>toast('✨ Actualizada a la versión '+APP_V),600);localStorage.setItem('lumi_ver',APP_V)}catch(e){}
render();
if(!S.stage)welcome();
if(S.settings.pin)showLock();
</script>
</body>
</html>
